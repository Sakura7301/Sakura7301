name: Refresh profile assets

on:
  schedule:
    - cron: '23 3 * * 1'      # 每周一 03:23 UTC
  workflow_dispatch:          # 也可以手动触发

permissions:
  contents: write             # 需要「Read and write permissions」

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render assets from latest GitHub data
        run: node scripts/render.mjs --fetch

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh profile data [skip ci]"
            git push || echo "skip: 仓库没有开启 Actions 写权限（Settings → Actions → General → Workflow permissions）"
          fi
